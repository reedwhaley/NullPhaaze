[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "retro-data-structures"
version = "0.44.1+nullphaze.20261024"
description = "Audited local RDS source with generated RSOT readers"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE.RSOT", "NOTICE.md"]
dependencies = ["construct==2.10.70", "lzokay==1.1.8", "pycryptodome==3.21.0", "Pillow==11.1.0", "typing-extensions==4.12.2", "ppc-asm==1.3.0", "numpy==2.2.3"]
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
[tool.setuptools.package-data]
"*" = ["py.typed"]

